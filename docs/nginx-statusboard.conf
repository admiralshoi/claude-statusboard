# nginx: serve the statusboard checkout at /statusboard/ and nothing else from it.
# Include this inside the server block whose root is the folder that holds the checkout (the checkout must be named
# statusboard). Without it, a web root that serves the parent folder also hands out .git/, config.local.php's
# neighbours, bin/, lib/, .claude/ and DEVELOPER.local.md as plain files. Adjust fastcgi_pass to your php-fpm.
# Simpler: `sb serve` (PHP's built-in server), which only ever serves the board.
location ^~ /statusboard/ {
    # The board's stylesheets and scripts.
    location ~ ^/statusboard/app/assets/[A-Za-z0-9._-]+\.(css|js)$ { }
    # The index of boards, each board, its review and roadmap pages, and their APIs.
    location ~ ^/statusboard/([a-z0-9]+/)?((roadmap|review)/)?(index|api)\.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
    location ~ ^/statusboard/([a-z0-9]+/)?((roadmap|review)/)?$ {
        index index.php;
    }
    location ~ ^/statusboard/([a-z0-9]+|[a-z0-9]+/(roadmap|review))$ {
        return 301 $uri/;
    }
    # Everything else in the checkout.
    return 404;
}
